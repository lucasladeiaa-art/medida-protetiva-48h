name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy
        run: sleep 120
      - name: Submit URLs
        run: |
          URLS=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --argjson u "$URLS" '{host:"lucasladeia.com.br",key:"c7c2308383d333eb9074c4c43987ddf5",keyLocation:"https://lucasladeia.com.br/c7c2308383d333eb9074c4c43987ddf5.txt",urlList:$u}' > body.json
          CODE=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "HTTP $CODE"; cat resp.txt
          [ "$CODE" = 200 ] || [ "$CODE" = 202 ]
